<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16碼編碼生成器 Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* 隱藏檔案輸入框 */
        input[type="file"] { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 簡易圖示組件 (SVG) ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Settings = (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const Copy = (props) => <IconBase {...props}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></IconBase>;
        const RefreshCw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>;
        const Plus = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>;
        const Database = (props) => <IconBase {...props}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></IconBase>;
        const PenTool = (props) => <IconBase {...props}><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;
        const AlertCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>;
        const FileSpreadsheet = (props) => <IconBase {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconBase>;
        const Upload = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></IconBase>;
        const Save = (props) => <IconBase {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>;
        const Info = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></IconBase>;

        // --- 主要邏輯 (調整欄位 6~11 為 input 模式) ---
        const INITIAL_FIELD_CONFIG = [
          { id: 1, label: '第一組 - 成品', length: 1, description: '第 1 碼', placeholder: 'A', inputType: 'select' },
          { id: 2, label: '第二組 - 供應商', length: 2, description: '第 2-3 碼', placeholder: '01', inputType: 'select' },
          { id: 3, label: '第三組 - 封裝', length: 2, description: '第 4-5 碼', placeholder: 'TO', inputType: 'select' },
          { id: 4, label: '第四組 - FAB', length: 1, description: '第 6 碼', placeholder: 'F', inputType: 'select' },
          { id: 5, label: '第五組 - 製程', length: 1, description: '第 7 碼', placeholder: 'P', inputType: 'select' },
          { id: 6, label: '第六組 - BVDSS', length: 2, description: '第 8-9 碼', placeholder: '30', inputType: 'input' },
          { id: 7, label: '第七組 - 極性', length: 1, description: '第 10 碼', placeholder: 'N', inputType: 'input' },
          { id: 8, label: '第八組 - 電阻', length: 3, description: '第 11-13 碼', placeholder: '005', inputType: 'input' }, 
          { id: 9, label: '第九組 - 選項1', length: 1, description: '第 14 碼', placeholder: 'A', inputType: 'input' },
          { id: 10, label: '第十組 - 選項2', length: 1, description: '第 15 碼', placeholder: 'B', inputType: 'input' },
          { id: 11, label: '第十一組 - 車規碼', length: 1, description: '第 16 碼', placeholder: 'V', inputType: 'input' },
        ];

        const DEFAULT_OPTIONS = {
          1: [{ value: 'A', label: 'A - MOSFET' }, { value: 'B', label: 'B - IC' }],
          2: [{ value: 'TS', label: 'TS - 台積電' }, { value: 'UM', label: 'UM - 聯電' }],
          3: [{ value: '23', label: '23 - SOT-23' }, { value: '52', label: '52 - TO-252' }],
          4: [{ value: 'F', label: 'F - FAB A' }],
          5: [{ value: 'P', label: 'P - Process A' }]
        };

        const DEFAULT_NOTES = {
            1: "請依照產品線選擇，若為開發中產品請選 B",
            6: "💡 提示：輸入數字如 30, 60",
            8: "💡 提示：電阻為3碼，例如 4.5mΩ 請填 004，含小數點用 R (如 4R7)"
        };

        function App() {
          const [activeTab, setActiveTab] = useState('generator');
          const [fieldOptions, setFieldOptions] = useState(DEFAULT_OPTIONS);
          const [fieldNotes, setFieldNotes] = useState(DEFAULT_NOTES);
          const [selections, setSelections] = useState({});
          const [generatedCode, setGeneratedCode] = useState('');
          const [copySuccess, setCopySuccess] = useState(false);
          const fileInputRef = useRef(null);

          useEffect(() => {
            try {
                const savedOptionsV3 = localStorage.getItem('codeGenOptions_v3');
                const savedNotesV3 = localStorage.getItem('codeGenNotes_v3');

                if (savedOptionsV3) {
                    setFieldOptions(JSON.parse(savedOptionsV3));
                    if (savedNotesV3) setFieldNotes(JSON.parse(savedNotesV3));
                } else {
                    const savedOptionsV2 = localStorage.getItem('codeGenOptions_v2');
                    if (savedOptionsV2) {
                        const parsedV2 = JSON.parse(savedOptionsV2);
                        const migratedOptions = { ...DEFAULT_OPTIONS };
                        Object.keys(parsedV2).forEach(key => {
                            if (parseInt(key) <= 11) {
                                migratedOptions[key] = parsedV2[key];
                            }
                        });
                        setFieldOptions(migratedOptions);
                        localStorage.setItem('codeGenOptions_v3', JSON.stringify(migratedOptions));
                    }
                }
            } catch (e) {
                console.warn("讀取資料發生錯誤", e);
            }

            const initialSelections = {};
            INITIAL_FIELD_CONFIG.forEach(field => {
              initialSelections[field.id] = '';
            });
            setSelections(initialSelections);
          }, []);

          const saveToLocal = (newOptions) => {
            setFieldOptions(newOptions);
            localStorage.setItem('codeGenOptions_v3', JSON.stringify(newOptions));
          };
          
          const saveNotesToLocal = (newNotes) => {
              setFieldNotes(newNotes);
              localStorage.setItem('codeGenNotes_v3', JSON.stringify(newNotes));
          };

          // 🌟 關鍵修正區：計算 16 碼 (即時顯示，自動補底線)
          useEffect(() => {
            let code = '';
            INITIAL_FIELD_CONFIG.forEach(field => {
              let val = selections[field.id] || '';
              
              // 確保代碼不會超過限制的長度
              if (val.length > field.length) {
                  val = val.substring(0, field.length);
              }
              
              // 如果使用者輸入或選擇的長度不足，自動用底線補齊剩下的空位
              // 這樣使用者一打字或一選擇，就能立刻在上方看到結果！
              if (val.length < field.length) {
                  code += val + '_'.repeat(field.length - val.length);
              } else {
                  code += val;
              }
            });
            setGeneratedCode(code);
          }, [selections]);

          const handleSelectionChange = (fieldId, value) => {
            setSelections(prev => ({ ...prev, [fieldId]: value }));
          };

          const copyToClipboard = () => {
            if (generatedCode.includes('_')) {
              alert('尚有未完成的代碼 (底線部分)，請先填寫完整 16 碼！');
              return;
            }
            navigator.clipboard.writeText(generatedCode).then(() => {
              setCopySuccess(true);
              setTimeout(() => setCopySuccess(false), 2000);
            });
          };

          const [editingFieldId, setEditingFieldId] = useState(1);
          const [addMode, setAddMode] = useState('single');
          const [newOptionValue, setNewOptionValue] = useState('');
          const [newOptionLabel, setNewOptionLabel] = useState('');
          const [batchText, setBatchText] = useState('');
          const [addError, setAddError] = useState('');
          const [addSuccessMsg, setAddSuccessMsg] = useState('');
          
          const handleNoteChange = (val) => {
              const newNotes = { ...fieldNotes, [editingFieldId]: val };
              saveNotesToLocal(newNotes);
          };

          const addOption = () => {
            const currentField = INITIAL_FIELD_CONFIG.find(f => f.id === editingFieldId);
            setAddSuccessMsg('');
            
            if (!newOptionValue || !newOptionLabel) {
              setAddError('代碼值與說明皆為必填');
              return;
            }
            
            const updatedOptions = {
              ...fieldOptions,
              [editingFieldId]: [
                ...(fieldOptions[editingFieldId] || []),
                { value: newOptionValue, label: `${newOptionValue} - ${newOptionLabel}` }
              ]
            };

            saveToLocal(updatedOptions);
            setNewOptionValue('');
            setNewOptionLabel('');
            setAddError('');
            setAddSuccessMsg('新增成功！');
            setTimeout(() => setAddSuccessMsg(''), 2000);
          };

          const handleBatchImport = () => {
            setAddError('');
            setAddSuccessMsg('');
            if (!batchText.trim()) {
              setAddError('請先貼上資料');
              return;
            }

            const currentField = INITIAL_FIELD_CONFIG.find(f => f.id === editingFieldId);
            const lines = batchText.trim().split('\n');
            const newItems = [];
            let errorCount = 0;

            lines.forEach(line => {
              let parts = line.split('\t');
              if (parts.length < 2) parts = line.split(',');

              if (parts.length >= 2) {
                const val = parts[0].trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
                const labelText = parts[1].trim();
                if (val && labelText) {
                  newItems.push({ value: val, label: `${val} - ${labelText}` });
                } else {
                  errorCount++;
                }
              } else {
                errorCount++;
              }
            });

            if (newItems.length === 0) {
              setAddError('無法識別任何有效資料，請確認格式為「代碼(Tab)說明」。');
              return;
            }

            const updatedOptions = {
              ...fieldOptions,
              [editingFieldId]: [
                ...(fieldOptions[editingFieldId] || []),
                ...newItems
              ]
            };

            saveToLocal(updatedOptions);
            setBatchText('');
            setAddSuccessMsg(`成功匯入 ${newItems.length} 筆資料！${errorCount > 0 ? `(${errorCount} 筆格式錯誤忽略)` : ''}`);
            setTimeout(() => setAddSuccessMsg(''), 3000);
          };

          const removeOption = (fieldId, indexToRemove) => {
            const updatedOptions = {
              ...fieldOptions,
              [fieldId]: fieldOptions[fieldId].filter((_, index) => index !== indexToRemove)
            };
            saveToLocal(updatedOptions);
          };

          const clearAll = () => {
             const initialSelections = {};
            INITIAL_FIELD_CONFIG.forEach(field => {
              initialSelections[field.id] = '';
            });
            setSelections(initialSelections);
          }

          const downloadTemplate = () => {
             const csvContent = "data:text/csv;charset=utf-8,Code,Description\nA0,範例選項1\nB1,範例選項2";
             const encodedUri = encodeURI(csvContent);
             const link = document.createElement("a");
             link.setAttribute("href", encodedUri);
             link.setAttribute("download", "import_template.csv");
             document.body.appendChild(link);
             link.click();
          }

          const handleExportBackup = () => {
            const backupData = {
                options: fieldOptions,
                notes: fieldNotes
            };
            const dataStr = JSON.stringify(backupData, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `codegen_backup_${new Date().toISOString().slice(0,10)}.json`;

            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            setAddSuccessMsg('資料庫已成功匯出 (含備註)！請妥善保存 .json 檔案。');
            setTimeout(() => setAddSuccessMsg(''), 3000);
          };

          const handleImportBackup = (event) => {
            const fileReader = new FileReader();
            const file = event.target.files[0];
            if (!file) return;

            fileReader.readAsText(file, "UTF-8");
            fileReader.onload = e => {
              try {
                const importedData = JSON.parse(e.target.result);
                
                let newOptions = {};
                let newNotes = {};

                if (importedData.options) {
                    newOptions = importedData.options;
                    newNotes = importedData.notes || {};
                } else {
                    newOptions = importedData;
                }

                if (newOptions && typeof newOptions === 'object') {
                    saveToLocal(newOptions);
                    saveNotesToLocal(newNotes);
                    setAddSuccessMsg('資料庫還原成功！所有選項與備註已更新。');
                    setTimeout(() => setAddSuccessMsg(''), 3000);
                } else {
                    setAddError('匯入失敗：檔案格式不正確');
                }
              } catch (err) {
                setAddError('匯入失敗：無法讀取檔案');
              }
            };
            event.target.value = '';
          };

          const currentEditField = INITIAL_FIELD_CONFIG.find(f => f.id === editingFieldId);

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8 font-sans">
              <div className="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
                {/* Header */}
                <div className="bg-indigo-600 p-6 text-white flex flex-col md:flex-row justify-between items-center gap-4">
                  <div>
                    <h1 className="text-2xl font-bold flex items-center gap-2">
                      <Database size={24} />
                      16碼編碼生成器 Pro
                    </h1>
                    <p className="text-indigo-200 text-sm mt-1">自建資料庫與規則組裝系統 v3.5 (即時防呆顯示版)</p>
                  </div>
                  <div className="flex gap-2">
                     <button 
                      onClick={() => setActiveTab('generator')}
                      className={`px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 ${activeTab === 'generator' ? 'bg-white text-indigo-600 shadow-lg' : 'bg-indigo-700 text-indigo-100 hover:bg-indigo-500'}`}
                    >
                      <PenTool size={18} />
                      生成代碼
                    </button>
                    <button 
                      onClick={() => setActiveTab('database')}
                      className={`px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 ${activeTab === 'database' ? 'bg-white text-indigo-600 shadow-lg' : 'bg-indigo-700 text-indigo-100 hover:bg-indigo-500'}`}
                    >
                      <Settings size={18} />
                      設定選項
                    </button>
                  </div>
                </div>

                {/* Main Content */}
                <div className="p-6">
                  {/* TAB 1: 生成器 */}
                  {activeTab === 'generator' && (
                    <div className="space-y-8 animate-fade-in">
                      <div className="bg-slate-100 p-6 rounded-xl border-2 border-slate-200 text-center sticky top-0 z-10 shadow-sm">
                        <div className="text-sm text-slate-500 mb-2 font-medium">目前的 16 碼組合結果</div>
                        <div className="text-3xl md:text-5xl font-mono font-bold tracking-widest text-indigo-600 break-all min-h-[60px] flex items-center justify-center bg-white rounded-lg border border-slate-300 py-4 shadow-inner">
                          {generatedCode || '________________'}
                        </div>
                        <div className="flex justify-center gap-4 mt-4">
                          <button onClick={copyToClipboard} className="flex items-center gap-2 px-6 py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition-colors shadow-md active:transform active:scale-95">
                            {copySuccess ? <CheckCircle size={18} /> : <Copy size={18} />}
                            {copySuccess ? '已複製！' : '複製代碼'}
                          </button>
                          <button onClick={clearAll} className="flex items-center gap-2 px-6 py-2 bg-white border border-slate-300 text-slate-600 rounded-full hover:bg-slate-50 transition-colors">
                            <RefreshCw size={18} />
                            清除重填
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {INITIAL_FIELD_CONFIG.map((field) => (
                          <div key={field.id} className="bg-white p-3 rounded-lg border border-slate-200 hover:border-indigo-300 transition-colors shadow-sm flex flex-col">
                            <div className="flex justify-between items-center mb-2">
                              <label className="font-bold text-slate-700 flex items-center gap-2 text-sm">
                                <span className="bg-indigo-100 text-indigo-700 w-5 h-5 rounded-full flex items-center justify-center text-xs shrink-0">{field.id}</span>
                                <span className="truncate" title={field.label}>{field.label}</span>
                              </label>
                              <span className="text-xs px-2 py-0.5 bg-slate-100 rounded text-slate-500 whitespace-nowrap">{field.description}</span>
                            </div>
                            
                            {/* 備註顯示區 (生成頁面) */}
                            {fieldNotes[field.id] && (
                                <div className="mb-2 p-2 bg-yellow-50 border border-yellow-200 rounded text-xs text-yellow-800 flex items-start gap-1.5 leading-relaxed">
                                    <Info size={14} className="shrink-0 mt-0.5" />
                                    <span>{fieldNotes[field.id]}</span>
                                </div>
                            )}

                            <div className="relative mt-auto">
                              {field.inputType === 'select' ? (
                                <select
                                  value={selections[field.id]}
                                  onChange={(e) => handleSelectionChange(field.id, e.target.value)}
                                  className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none appearance-none text-sm"
                                >
                                  <option value="">請選擇...</option>
                                  {(fieldOptions[field.id] || []).map((opt, idx) => (
                                    <option key={idx} value={opt.value}>{opt.label}</option>
                                  ))}
                                </select>
                              ) : (
                                <input
                                  type="text"
                                  maxLength={field.length}
                                  placeholder={`輸入 ${field.length} 碼`}
                                  value={selections[field.id]}
                                  onChange={(e) => handleSelectionChange(field.id, e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase())}
                                  className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none font-mono text-sm"
                                />
                              )}
                              <div className="flex justify-between items-center mt-1">
                                <span className="text-xs text-indigo-500 cursor-pointer hover:underline" onClick={() => { setEditingFieldId(field.id); setActiveTab('database'); }}>
                                  {field.inputType === 'select' ? '+ 設定選項與備註' : '修改備註說明'}
                                </span>
                                <div className={`text-xs ${(selections[field.id]?.length || 0) === field.length ? 'text-green-600' : ((selections[field.id]?.length || 0) > 0 ? 'text-amber-500' : 'text-slate-400')}`}>
                                  {selections[field.id]?.length || 0}/{field.length}
                                </div>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 2: 資料庫編輯器 */}
                  {activeTab === 'database' && (
                    <div className="animate-fade-in">
                      <div className="mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="p-4 bg-blue-50 border border-blue-200 rounded-lg flex items-start gap-3">
                          <AlertCircle className="text-blue-600 shrink-0 mt-1" size={20} />
                          <div className="text-sm text-blue-800">
                            <p className="font-bold mb-1">操作說明：</p>
                            <ul className="list-disc list-inside space-y-1">
                              <li>所有欄位（無論是選單或輸入）皆可設定「備註」，輔助同事填寫。</li>
                              <li>下拉選單欄位可進一步擴充或匯入選項代碼。</li>
                            </ul>
                          </div>
                        </div>

                        <div className="p-4 bg-slate-100 border border-slate-200 rounded-lg flex flex-col justify-center">
                           <p className="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">
                             <Save size={16} /> 資料庫備份與還原
                           </p>
                           <div className="flex gap-2">
                             <button onClick={handleExportBackup} className="flex-1 bg-white border border-slate-300 text-slate-700 py-1.5 px-3 rounded text-sm hover:bg-slate-50 flex items-center justify-center gap-2 shadow-sm">
                               <Download size={14} /> 匯出備份
                             </button>
                             <button onClick={() => fileInputRef.current.click()} className="flex-1 bg-white border border-slate-300 text-slate-700 py-1.5 px-3 rounded text-sm hover:bg-slate-50 flex items-center justify-center gap-2 shadow-sm">
                               <Upload size={14} /> 匯入還原
                             </button>
                             <input type="file" ref={fileInputRef} onChange={handleImportBackup} accept=".json" />
                           </div>
                           <p className="text-xs text-slate-400 mt-2 text-center">* 備份檔案包含選項與備註</p>
                        </div>
                      </div>

                      {(addSuccessMsg || addError) && (
                        <div className={`mb-4 p-3 rounded-lg flex items-center gap-2 ${addError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`}>
                          {addError ? <AlertCircle size={18}/> : <CheckCircle size={18}/>}
                          <span className="text-sm font-medium">{addError || addSuccessMsg}</span>
                        </div>
                      )}

                      <div className="flex flex-col md:flex-row gap-6">
                        <div className={`w-full ${currentEditField?.inputType === 'input' ? 'md:w-full' : 'md:w-1/3'} space-y-4`}>
                          <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                            <div className="mb-4">
                              <label className="block text-sm font-medium text-slate-600 mb-1">1. 選擇目標欄位</label>
                              <select value={editingFieldId} onChange={(e) => { setEditingFieldId(Number(e.target.value)); setAddError(''); setAddSuccessMsg(''); }} className="w-full p-2 border border-slate-300 rounded-md bg-slate-50 font-bold text-indigo-600">
                                {INITIAL_FIELD_CONFIG.map(f => (
                                  <option key={f.id} value={f.id}>{f.id}. {f.label} ({f.length}碼) - {f.inputType === 'select' ? '選單' : '手動輸入'}</option>
                                ))}
                              </select>
                            </div>

                            {/* 備註編輯區 (所有欄位皆可使用) */}
                            <div className="mb-4 p-3 bg-yellow-50 rounded-lg border border-yellow-200">
                                <label className="block text-sm font-bold text-yellow-800 mb-1 flex items-center gap-1">
                                    <PenTool size={12}/> 填寫說明 (備註)
                                </label>
                                <textarea
                                    value={fieldNotes[editingFieldId] || ''}
                                    onChange={(e) => handleNoteChange(e.target.value)}
                                    className="w-full p-2 border border-yellow-300 rounded text-sm mb-1 focus:ring-2 focus:ring-yellow-400 outline-none"
                                    placeholder="在此輸入此欄位的填寫規則或備註... (打字即自動儲存)"
                                    rows={2}
                                />
                                <div className="text-right text-[10px] text-yellow-600">輸入後自動儲存</div>
                            </div>

                            {currentEditField?.inputType === 'input' ? (
                                <div className="p-4 bg-slate-50 text-slate-500 rounded-lg text-sm text-center border border-slate-200 mt-4">
                                    <svg className="w-8 h-8 mx-auto mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    此為自由輸入欄位，無需設定下拉選項。<br/>您可於上方編輯「填寫說明(備註)」即可。
                                </div>
                            ) : (
                                <>
                                  <div className="flex bg-slate-100 p-1 rounded-lg mb-4 mt-2">
                                    <button onClick={() => setAddMode('single')} className={`flex-1 py-1 text-sm rounded-md transition-all ${addMode === 'single' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-slate-500'}`}>單筆輸入</button>
                                    <button onClick={() => setAddMode('batch')} className={`flex-1 py-1 text-sm rounded-md transition-all ${addMode === 'batch' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-slate-500'}`}>Excel 匯入</button>
                                  </div>

                                  {addMode === 'single' && (
                                    <div className="space-y-3 animate-fade-in">
                                      <div>
                                        <label className="block text-sm font-medium text-slate-600 mb-1">代碼值 (需 {currentEditField?.length} 碼)</label>
                                        <input type="text" value={newOptionValue} onChange={(e) => setNewOptionValue(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''))} maxLength={currentEditField?.length} placeholder={currentEditField?.placeholder} className="w-full p-2 border border-slate-300 rounded-md font-mono" />
                                      </div>
                                      <div>
                                        <label className="block text-sm font-medium text-slate-600 mb-1">選項說明</label>
                                        <input type="text" value={newOptionLabel} onChange={(e) => setNewOptionLabel(e.target.value)} placeholder="說明文字..." className="w-full p-2 border border-slate-300 rounded-md" />
                                      </div>
                                      <button onClick={addOption} className="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition flex justify-center items-center gap-2 mt-2"><Plus size={18} /> 新增選項</button>
                                    </div>
                                  )}

                                  {addMode === 'batch' && (
                                    <div className="space-y-3 animate-fade-in">
                                      <div>
                                        <label className="block text-sm font-medium text-slate-600 mb-1 flex justify-between">
                                          <span>貼上 Excel 資料</span>
                                          <button onClick={downloadTemplate} className="text-xs text-indigo-500 hover:underline flex items-center gap-1"><Download size={10} /> 下載範例 CSV</button>
                                        </label>
                                        <textarea value={batchText} onChange={(e) => setBatchText(e.target.value)} rows={6} placeholder={`A\t範例選項1\nB\t範例選項2`} className="w-full p-2 border border-slate-300 rounded-md font-mono text-sm leading-relaxed" />
                                      </div>
                                      <button onClick={handleBatchImport} className="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition flex justify-center items-center gap-2 mt-2"><FileSpreadsheet size={18} /> 開始解析匯入</button>
                                    </div>
                                  )}
                                </>
                            )}
                          </div>
                        </div>

                        {currentEditField?.inputType === 'select' && (
                          <div className="w-full md:w-2/3">
                             <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden h-full flex flex-col">
                                <div className="p-4 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center shrink-0">
                                  <span>{currentEditField?.label}</span>
                                  <span className="text-xs font-normal text-slate-500 bg-white px-2 py-1 rounded border">{fieldOptions[editingFieldId]?.length || 0} 筆</span>
                                </div>
                                <div className="flex-1 overflow-y-auto p-2 min-h-[300px]">
                                  {(!fieldOptions[editingFieldId] || fieldOptions[editingFieldId].length === 0) ? (
                                    <div className="flex flex-col items-center justify-center h-full text-slate-400 gap-2">
                                      <Database size={40} className="text-slate-200"/>
                                      <p>此欄位尚未建立資料。</p>
                                    </div>
                                  ) : (
                                    <ul className="space-y-2">
                                      {fieldOptions[editingFieldId].map((opt, idx) => (
                                        <li key={idx} className="flex items-center justify-between p-3 bg-white border border-slate-100 rounded-lg hover:shadow-sm group">
                                          <div className="flex items-center gap-3">
                                            <span className="font-mono bg-indigo-50 text-indigo-700 px-2 py-1 rounded font-bold border border-indigo-100 min-w-[40px] text-center">{opt.value}</span>
                                            <span className="text-slate-700">{opt.label.split(' - ')[1] || opt.label}</span>
                                          </div>
                                          <button onClick={() => removeOption(editingFieldId, idx)} className="text-slate-300 hover:text-red-500 transition-colors p-2 opacity-0 group-hover:opacity-100" title="刪除"><Trash2 size={16} /></button>
                                        </li>
                                      ))}
                                    </ul>
                                  )}
                                </div>
                             </div>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
                
                {/* Footer */}
                <div className="bg-slate-50 p-4 text-center text-slate-400 text-xs border-t border-slate-200">
                  系統會自動保存您的資料庫設定於此瀏覽器中 (v3.5 即時防呆版)
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
